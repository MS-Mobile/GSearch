[versions]
agp = "9.3.2"
android-compile-sdk="37"
android-min-sdk="26"
android-target-sdk="37"
kotlinBundledByAgp = "2.4.10"
ksp = "2.3.11"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
# Compose comes in for the config screen and is also what Glance is built on.
composeBom = "2026.08.00"
activityCompose = "1.13.0"
# 1.1.1 is the newest stable; 1.2.0 has only reached rc01.
glance = "1.2.0"

# The AGP screenshot-test plugin, and the assertion API the tests it generates link
# against. They ship as a pair off the same alpha train, so both move together.
composeScreenshot = "0.0.1-alpha16"

# Static analysis. Spotless only drives ktlint — the ktlint version below is what actually
# formats, and Spotless downloads it itself rather than bundling one.
spotless = "8.10.0"
ktlint = "1.8.0"
# The compose-rules ruleset, wired through ktlint (see the note on the library below).
composeRules = "0.6.4"
# An alpha on purpose, and not an easy one to walk back. The 1.x line (group
# io.gitlab.arturbosch.detekt, latest 1.23.8) embeds the Kotlin 1.9 compiler and runs
# in-process in the Gradle daemon. This build's daemon is Java 25, which that compiler
# rejects outright — it dies on `--jvm-target 25`, and pinning jvmTarget only gets it as far
# as failing with the bare version string `25.0.2`. The 1.x Detekt task exposes no
# javaLauncher or jdkHome, so there is no way to hand it an older JDK short of downgrading
# the whole daemon. 2.x (group dev.detekt) is built on the Kotlin 2 analysis API and runs
# clean here. Move to 2.0.0 final when it ships; do not "fix" this by reverting to 1.23.8.
detekt = "2.0.0-alpha.6"

[libraries]
# Not a dependency of the app — Spotless loads this as a ktlint custom ruleset, and the
# version catalog is just where the coordinate is kept so it is bumped with the rest.
compose-rules-ktlint = { group = "io.nlopez.compose.rules", name = "ktlint", version.ref = "composeRules" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Versions for every compose-* artifact below come from the BOM, so they are omitted here.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "composeScreenshot" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android alias: AGP 9 supplies the Kotlin plugin and its version itself.
# Applying org.jetbrains.kotlin.android on top fails with a duplicate `kotlin` extension.
# Declared for later use; not applied — nothing here does annotation processing.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Unlike org.jetbrains.kotlin.android, this one coexists with built-in Kotlin: it only
# registers a compiler plugin and a `composeCompiler` extension, never a `kotlin` one.
# AGP refuses to configure with buildFeatures.compose = true unless it is applied.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinBundledByAgp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
# Adds the `screenshotTest` source set and the update/validate tasks. Kept behind the
# android.experimental.enableScreenshotTest flag in app/build.gradle.kts, which AGP still
# requires while the plugin is an alpha.
compose-screenshot = { id = "com.android.compose.screenshot", version.ref = "composeScreenshot" }

